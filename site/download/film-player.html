<div class="film-player" data-film-player role="group" aria-label="Glee launch film player">
  <video controls muted playsinline preload="metadata" poster="assets/glee-launch-poster.jpg" aria-label="Glee 19-second launch film">
    <source src="assets/glee-launch.mp4" type="video/mp4">
    <p><a href="assets/glee-launch.mp4">Open the Glee launch film</a>.</p>
  </video>
  <div class="film-main-controls" hidden>
    <button class="film-restart" type="button" aria-label="Restart Glee launch film" title="Replay from the beginning">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 8a8 8 0 1 1-1 7M5 3v5h5"/></svg>
    </button>
    <button class="film-toggle" type="button" aria-label="Play Glee launch film" title="Play">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
        <g data-film-icon="play"><path d="M9 5.5 19 12 9 18.5Z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></g>
        <g data-film-icon="pause" hidden><rect x="6.5" y="5" width="4" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.7"/></g>
      </svg>
    </button>
  </div>
  <div class="film-tools" hidden>
    <button class="film-sound" type="button" aria-label="Mute Glee launch film" title="Mute">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m11 5-6 4H2v6h3l6 4z"/><g data-sound-icon="on"><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></g><g data-sound-icon="off" hidden><path d="m16 9 6 6m0-6-6 6"/></g></svg>
    </button>
    <button class="film-fullscreen" type="button" aria-label="Show Glee launch film full screen" title="Full screen">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
    </button>
  </div>
  <p class="film-error" role="status" hidden>The film couldn’t load. <a href="assets/glee-launch.mp4">Open the video directly ↗</a></p>
</div>
