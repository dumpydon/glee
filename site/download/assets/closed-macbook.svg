  <defs>
    <linearGradient id="aluminum" x1="329" y1="76" x2="856" y2="391" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60665f"/>
      <stop offset=".4" stop-color="#393e3a"/>
      <stop offset="1" stop-color="#222724"/>
    </linearGradient>
    <linearGradient id="edge" x1="133" y1="272" x2="1073" y2="355" gradientUnits="userSpaceOnUse">
      <stop stop-color="#464d44"/>
      <stop offset=".48" stop-color="#2d332e"/>
      <stop offset="1" stop-color="#151a17"/>
    </linearGradient>
    <linearGradient id="rim" x1="295" y1="118" x2="833" y2="401" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c3cebb" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#858e82" stop-opacity=".27"/>
