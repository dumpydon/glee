  <path d="m126 289 613 124c14 3 25 1 36-6l306-188" stroke="#95a18d" stroke-opacity=".19" stroke-width="1.4"/>

  <use href="#lid" fill="url(#aluminum)"/>
  <use href="#lid" fill="url(#reflection)" stroke="url(#rim)" stroke-width="2"/>
  <path d="m409 334 94 19-7 3c-3 2-7 2-11 1l-67-14c-4-1-7-3-9-6Z" fill="#111712"/>

