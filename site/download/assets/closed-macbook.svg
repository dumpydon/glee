  <path d="M1094 191v22c0 3-3 6-8 9L776 412c-11 7-23 9-37 6L123 293c-10-2-15-6-15-11v-22c0 5 5 9 15 11l616 125c14 3 26 1 37-6l310-191c5-3 8-5 8-8Z" fill="url(#edge)"/>
